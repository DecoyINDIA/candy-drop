name: Test browser arcade

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Check source and game rules
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and touch gameplay
        run: npm run test:browser
      - name: Save screenshots and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
