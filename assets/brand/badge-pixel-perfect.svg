<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  
  <defs>
    <!-- CRT Scanlines pattern -->
    <pattern id="crt-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.32"/>
    </pattern>

    <!-- Retro Wireframe Grid pattern -->
    <pattern id="retro-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a1f4d" stroke-width="1.2" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cabinet-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02040a" flood-opacity="0.75"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-synthwave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="45%" stop-color="#140a2e"/>
      <stop offset="75%" stop-color="#241242"/>
      <stop offset="100%" stop-color="#0d081e"/>
    </linearGradient>

    <linearGradient id="neon-text-candy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3377"/>
      <stop offset="40%" stop-color="#ff0055"/>
      <stop offset="70%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>

    <linearGradient id="gold-metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="30%" stop-color="#ffc700"/>
      <stop offset="70%" stop-color="#d48800"/>
      <stop offset="100%" stop-color="#fff080"/>
    </linearGradient>

    <linearGradient id="cabinet-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="15%" stop-color="#182234"/>
      <stop offset="50%" stop-color="#202b40"/>
      <stop offset="85%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="cabinet-screen-bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101520"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <radialGradient id="screen-crt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3854" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#08101a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#03060a" stop-opacity="1.0"/>
    </radialGradient>
  </defs>
  

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="168" height="168" rx="16" fill="url(#bg-synthwave)" stroke="#221838" stroke-width="2"/>
  <rect x="10" y="10" width="160" height="160" rx="12" fill="none" stroke="#d600ff" stroke-width="1.8" opacity="0.85"/>

  <!-- Glowing Emblem Base -->
  <circle cx="90" cy="80" r="42" fill="#0d1422" stroke="#d600ff" stroke-width="2"/>
  <circle cx="90" cy="80" r="36" fill="#d600ff" opacity="0.12" filter="blur(4px)"/>

  <!-- Icon Graphic -->
  
      <!-- Prismatic Gem with Crosshairs -->
      <g transform="translate(90, 80)">
        <!-- Targeting Crosshair Rings -->
        <circle cx="0" cy="0" r="25" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="-28" y1="0" x2="-20" y2="0" stroke="#00f0ff" stroke-width="2"/>
        <line x1="20" y1="0" x2="28" y2="0" stroke="#00f0ff" stroke-width="2"/>
        <line x1="0" y1="-28" x2="0" y2="-20" stroke="#00f0ff" stroke-width="2"/>
        <line x1="0" y1="20" x2="0" y2="28" stroke="#00f0ff" stroke-width="2"/>
        <!-- Prismatic Diamond Gem -->
        <polygon points="0,-18 18,-4 0,18 -18,-4" fill="#a000e0" stroke="#ff77ff" stroke-width="2"/>
        <polygon points="0,-18 10,-4 0,18" fill="#c020ff"/>
        <polygon points="0,-18 0,18 -10,-4" fill="#8000b0"/>
        <!-- Specular Star Sparkle -->
        <circle cx="0" cy="-4" r="3" fill="#ffffff"/>
      </g>
    

  <!-- Title Pill -->
  <g transform="translate(90, 142)">
    <rect x="-65" y="-10" width="130" height="20" rx="10" fill="#0c101c" stroke="#d600ff" stroke-width="1.2"/>
    <text x="0" y="4" font-family="'Courier New', monospace" font-size="9" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1">PIXEL PERFECT</text>
  </g>

  <!-- Subtitle -->
  <text x="90" y="162" font-family="'Arial', sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#00f0ff">100% Accuracy Rating</text>
</svg>
