<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Candy Drop 🍬</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #12082b;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
// ============================================================
// CANDY DROP — catch candies, dodge bombs, chase the combo.
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- dopamine palette ----------
const CANDY_COLORS = [
  { main: '#FF3E7F', glow: '#FF7AA8' },  // hot pink
  { main: '#FFD23F', glow: '#FFE888' },  // sunshine yellow
  { main: '#3EE577', glow: '#8CFFB5' },  // lime green
  { main: '#38C6FF', glow: '#8ADEFF' },  // electric blue
  { main: '#B266FF', glow: '#D4A6FF' },  // grape purple
  { main: '#FF7A29', glow: '#FFB07A' },  // tangerine
];

// ---------- audio (tiny synth, no files) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  catch(combo) { beep(400 + Math.min(combo, 24) * 60, 0.12, 'sine', 0.18, 700 + combo * 60); },
  star()   { beep(880, 0.3, 'triangle', 0.2, 1760); beep(1320, 0.35, 'sine', 0.12, 2640); },
  heart()  { beep(523, 0.15, 'sine', 0.2); setTimeout(() => beep(784, 0.25, 'sine', 0.2), 120); },
  bomb()   { beep(160, 0.4, 'sawtooth', 0.25, 40); },
  miss()   { beep(220, 0.2, 'square', 0.08, 110); },
  level()  { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.18), i * 90)); },
  over()   { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sawtooth', 0.1), i * 160)); },
};

// ---------- game state ----------
const STATE = { MENU: 0, PLAYING: 1, OVER: 2 };
let state = STATE.MENU;

const player = { x: W / 2, targetX: W / 2, w: 96, h: 26, wobble: 0 };
let items = [];        // falling things
let particles = [];
let popups = [];       // floating score text
let stars = [];        // background twinkles

let score = 0, best = +(localStorage.getItem('candydrop_best') || 0);
let lives = 3, level = 1, combo = 0, bestCombo = 0;
let spawnTimer = 0, shake = 0, flash = 0, flashColor = '#fff';
let levelBanner = 0, frenzy = 0;   // frenzy = star power seconds
let keys = {};
let lastTime = 0;

// level curve: what changes as levels rise
function levelCfg(lv) {
  return {
    fallSpeed: 140 + lv * 26,                 // px/sec base
    spawnEvery: Math.max(0.28, 0.85 - lv * 0.05),
    bombChance: Math.min(0.32, 0.05 + lv * 0.025),
    starChance: 0.035,
    heartChance: lives < 3 ? 0.02 : 0.004,
    drift: lv >= 3 ? Math.min(60, (lv - 2) * 14) : 0,   // sideways sway
  };
}
function pointsToLevel(lv) { return lv * 12; }  // catches needed per level
let catchesThisLevel = 0;

// ---------- background twinkles ----------
function initStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + 0.4, tw: Math.random() * Math.PI * 2 });
  }
}
initStars();

// ---------- input ----------
function movePointer(x) {
  player.targetX = x;
  ensureAudio();
}
canvas.addEventListener('mousemove', e => movePointer(e.clientX));
canvas.addEventListener('touchmove', e => { e.preventDefault(); movePointer(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleTap(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener('mousedown', e => handleTap(e.clientX));
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== STATE.PLAYING) startGame();
});
window.addEventListener('keyup', e => keys[e.key] = false);

function handleTap(x) {
  ensureAudio();
  if (state === STATE.MENU) startGame();
  else if (state === STATE.OVER && overCooldown <= 0) startGame();
  else movePointer(x);
}

let overCooldown = 0;

function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; level = 1; combo = 0; bestCombo = 0;
  catchesThisLevel = 0; frenzy = 0;
  items = []; particles = []; popups = [];
  spawnTimer = 0; levelBanner = 0;
  player.x = player.targetX = W / 2;
  sfx.level();
}

// ---------- spawning ----------
function spawnItem() {
  const cfg = levelCfg(level);
  const r = Math.random();
  let type = 'candy';
  if (r < cfg.bombChance && frenzy <= 0) type = 'bomb';
  else if (r < cfg.bombChance + cfg.starChance) type = 'star';
  else if (r < cfg.bombChance + cfg.starChance + cfg.heartChance) type = 'heart';

  const color = CANDY_COLORS[(Math.random() * CANDY_COLORS.length) | 0];
  items.push({
    type,
    x: 30 + Math.random() * (W - 60),
    y: -30,
    r: type === 'candy' ? 14 + Math.random() * 6 : 16,
    vy: levelCfg(level).fallSpeed * (0.85 + Math.random() * 0.4),
    phase: Math.random() * Math.PI * 2,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 4,
    color,
  });
}

// ---------- juice ----------
function burst(x, y, color, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.4 + Math.random()) * (speed || 220);
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80,
      life: 0.5 + Math.random() * 0.5, maxLife: 1,
      r: 2 + Math.random() * 4, color,
    });
  }
}
function popup(x, y, text, color, big) {
  popups.push({ x, y, text, color, life: 1, big: !!big });
}

// ---------- update ----------
function update(dt) {
  // player follows pointer / keys
  if (keys['ArrowLeft'] || keys['a']) player.targetX -= 560 * dt;
  if (keys['ArrowRight'] || keys['d']) player.targetX += 560 * dt;
  player.targetX = Math.max(player.w / 2, Math.min(W - player.w / 2, player.targetX));
  const dx = player.targetX - player.x;
  player.x += dx * Math.min(1, dt * 14);
  player.wobble += dt * 6;

  for (const s of stars) s.tw += dt * 2;

  if (state !== STATE.PLAYING) {
    overCooldown = Math.max(0, overCooldown - dt);
    updateFx(dt);
    return;
  }

  if (frenzy > 0) frenzy -= dt;

  // spawn
  const cfg = levelCfg(level);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer = frenzy > 0 ? cfg.spawnEvery * 0.45 : cfg.spawnEvery;
  }

  // items fall
  const catchY = H - 64;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt * (frenzy > 0 && it.type === 'candy' ? 1.15 : 1);
    it.phase += dt * 3;
    it.rot += it.vrot * dt;
    if (cfg.drift) it.x += Math.sin(it.phase) * cfg.drift * dt;

    // caught?
    if (it.y > catchY - 6 && it.y < catchY + 34 &&
        Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.7) {
      items.splice(i, 1);
      onCatch(it);
      continue;
    }
    // missed (fell past)
    if (it.y > H + 40) {
      items.splice(i, 1);
      if (it.type === 'candy' && frenzy <= 0) {
        combo = 0;
        sfx.miss();
      }
    }
  }

  updateFx(dt);
}

function updateFx(dt) {
  shake = Math.max(0, shake - dt * 26);
  flash = Math.max(0, flash - dt * 2.5);
  levelBanner = Math.max(0, levelBanner - dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 60 * dt;
    p.life -= dt * 1.1;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

function onCatch(it) {
  if (it.type === 'bomb') {
    lives--;
    combo = 0;
    shake = 14; flash = 0.5; flashColor = '#FF3E30';
    burst(it.x, it.y, { main: '#FF5340', glow: '#FFAA80' }, 26, 320);
    sfx.bomb();
    popup(player.x, H - 110, '💥 OUCH!', '#FF6B5E', true);
    if (lives <= 0) gameOver();
    return;
  }
  if (it.type === 'heart') {
    if (lives < 3) lives++;
    burst(it.x, it.y, { main: '#FF3E7F', glow: '#FFB3CE' }, 20, 240);
    sfx.heart();
    popup(player.x, H - 110, '+1 ❤', '#FF6FA5', true);
    return;
  }
  if (it.type === 'star') {
    frenzy = 5;
    burst(it.x, it.y, { main: '#FFD23F', glow: '#FFF3B0' }, 30, 300);
    sfx.star();
    shake = 6; flash = 0.35; flashColor = '#FFD23F';
    popup(player.x, H - 110, '⭐ FRENZY! ⭐', '#FFE06A', true);
    return;
  }

  // candy
  combo++;
  bestCombo = Math.max(bestCombo, combo);
  const mult = 1 + Math.floor(combo / 5);          // +1x every 5 streak
  const pts = (frenzy > 0 ? 2 : 1) * 10 * mult;
  score += pts;
  catchesThisLevel++;
  burst(it.x, it.y, it.color, 12 + Math.min(combo, 14), 200);
  sfx.catch(combo);
  popup(it.x, it.y - 10, '+' + pts, it.color.glow, false);
  if (combo > 0 && combo % 5 === 0) {
    popup(player.x, H - 130, combo + ' COMBO! x' + mult, '#FFE06A', true);
    shake = Math.min(8, 3 + combo * 0.2);
  }

  // level up
  if (catchesThisLevel >= pointsToLevel(level)) {
    catchesThisLevel = 0;
    level++;
    levelBanner = 2;
    flash = 0.4; flashColor = '#8CFFB5';
    sfx.level();
    burst(W / 2, H / 2, { main: '#3EE577', glow: '#B4FFD1' }, 40, 380);
  }
}

function gameOver() {
  state = STATE.OVER;
  overCooldown = 0.8;         // avoid instant accidental restart
  if (score > best) {
    best = score;
    localStorage.setItem('candydrop_best', best);
  }
  sfx.over();
  shake = 18;
}

// ---------- drawing ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (frenzy > 0) {
    g.addColorStop(0, '#3a1a5e');
    g.addColorStop(1, '#1a0b3e');
  } else {
    g.addColorStop(0, '#241250');
    g.addColorStop(1, '#12082b');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // twinkles
  for (const s of stars) {
    const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#cbb8ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);

  if (it.type === 'candy') {
    ctx.rotate(it.rot);
    // glow
    ctx.shadowColor = it.color.main;
    ctx.shadowBlur = 18;
    // wrapper twists
    ctx.fillStyle = it.color.main;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * it.r * 0.7, 0);
      ctx.lineTo(s * (it.r * 0.7 + 9), -7);
      ctx.lineTo(s * (it.r * 0.7 + 9), 7);
      ctx.closePath();
      ctx.fill();
    }
    // body
    ctx.beginPath();
    ctx.arc(0, 0, it.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-it.r * 0.3, -it.r * 0.35, it.r * 0.32, it.r * 0.2, -0.6, 0, Math.PI * 2);
    ctx.fill();
    // stripe
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, it.r * 0.55, 0.4, 2.2);
    ctx.stroke();
  } else if (it.type === 'bomb') {
    ctx.shadowColor = '#FF4020';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#2b2b3a';
    ctx.beginPath();
    ctx.arc(0, 2, it.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(4, -it.r + 2);
    ctx.quadraticCurveTo(12, -it.r - 8, 8, -it.r - 12);
    ctx.stroke();
    // spark
    const sp = 0.5 + 0.5 * Math.sin(it.phase * 6);
    ctx.fillStyle = `rgba(255,${180 + sp * 70 | 0},60,${0.7 + sp * 0.3})`;
    ctx.beginPath();
    ctx.arc(8, -it.r - 12, 3 + sp * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.ellipse(-it.r * 0.3, -it.r * 0.25 + 2, it.r * 0.3, it.r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fill();
  } else if (it.type === 'star') {
    ctx.rotate(it.rot * 0.5);
    ctx.shadowColor = '#FFD23F';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#FFD23F';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = (i * 2 * Math.PI) / 5 - Math.PI / 2;
      const a2 = a1 + Math.PI / 5;
      ctx.lineTo(Math.cos(a1) * it.r * 1.2, Math.sin(a1) * it.r * 1.2);
      ctx.lineTo(Math.cos(a2) * it.r * 0.5, Math.sin(a2) * it.r * 0.5);
    }
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (it.type === 'heart') {
    const pulse = 1 + 0.12 * Math.sin(it.phase * 4);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = '#FF3E7F';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#FF4E8B';
    ctx.beginPath();
    const r = it.r * 0.62;
    ctx.moveTo(0, r * 0.9);
    ctx.bezierCurveTo(-r * 2, -r * 0.6, -r * 0.9, -r * 1.8, 0, -r * 0.5);
    ctx.bezierCurveTo(r * 0.9, -r * 1.8, r * 2, -r * 0.6, 0, r * 0.9);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawPlayer() {
  const x = player.x, y = H - 52;
  const tilt = (player.targetX - player.x) * 0.002;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // frenzy aura
  if (frenzy > 0) {
    ctx.shadowColor = '#FFD23F';
    ctx.shadowBlur = 30;
  } else {
    ctx.shadowColor = '#B266FF';
    ctx.shadowBlur = 16;
  }

  // basket body
  const g = ctx.createLinearGradient(0, -14, 0, 22);
  g.addColorStop(0, frenzy > 0 ? '#FFE06A' : '#C084FF');
  g.addColorStop(1, frenzy > 0 ? '#FFAA20' : '#7C3AED');
  ctx.fillStyle = g;
  roundRect(-player.w / 2, -8, player.w, 30, 12);
  ctx.fill();
  ctx.shadowBlur = 0;

  // rim
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  roundRect(-player.w / 2 - 5, -14, player.w + 10, 12, 6);
  ctx.fill();

  // little face 🙂 (subtle charm)
  ctx.fillStyle = '#3a1a5e';
  const blink = Math.sin(player.wobble * 0.7) > 0.97 ? 0.5 : 3;
  ctx.beginPath(); ctx.ellipse(-12, 8, 3, blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, 8, 3, blink, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1a5e';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 10, 7, 0.25, Math.PI - 0.25); ctx.stroke();

  ctx.restore();
}

function drawHUD() {
  ctx.textBaseline = 'top';
  // score
  ctx.font = '800 30px "Segoe UI", sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.shadowColor = '#B266FF'; ctx.shadowBlur = 12;
  ctx.fillText(score, 18, 14);
  ctx.shadowBlur = 0;
  ctx.font = '600 13px "Segoe UI", sans-serif';
  ctx.fillStyle = '#b6a3e8';
  ctx.fillText('BEST ' + best, 19, 48);

  // level
  ctx.textAlign = 'center';
  ctx.font = '800 18px "Segoe UI", sans-serif';
  ctx.fillStyle = '#8CFFB5';
  ctx.fillText('LVL ' + level, W / 2, 16);
  // level progress bar
  const pw = 120, prog = catchesThisLevel / pointsToLevel(level);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(W / 2 - pw / 2, 40, pw, 6, 3); ctx.fill();
  ctx.fillStyle = '#3EE577';
  roundRect(W / 2 - pw / 2, 40, Math.max(6, pw * prog), 6, 3); ctx.fill();

  // lives
  ctx.textAlign = 'right';
  ctx.font = '22px "Segoe UI", sans-serif';
  let hearts = '';
  for (let i = 0; i < 3; i++) hearts = (i < lives ? '❤️' : '🖤') + hearts;
  ctx.fillText(hearts, W - 16, 16);

  // combo
  if (combo >= 3) {
    const mult = 1 + Math.floor(combo / 5);
    ctx.textAlign = 'right';
    ctx.font = '800 ' + (16 + Math.min(combo, 20)) + 'px "Segoe UI", sans-serif';
    ctx.fillStyle = '#FFD23F';
    ctx.shadowColor = '#FF7A29'; ctx.shadowBlur = 14;
    ctx.fillText(combo + '🔥 x' + mult, W - 16, 52);
    ctx.shadowBlur = 0;
  }

  // frenzy timer
  if (frenzy > 0) {
    ctx.textAlign = 'center';
    ctx.font = '800 22px "Segoe UI", sans-serif';
    ctx.fillStyle = '#FFE06A';
    ctx.shadowColor = '#FFD23F'; ctx.shadowBlur = 16;
    ctx.fillText('⭐ FRENZY ' + frenzy.toFixed(1) + 's — DOUBLE POINTS! ⭐', W / 2, 64);
    ctx.shadowBlur = 0;
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = Math.random() < 0.5 ? p.color.main : p.color.glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
    ctx.font = (p.big ? '800 30px' : '700 19px') + ' "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = p.big ? 16 : 8;
    ctx.fillText(p.text, p.x, p.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawCenteredPanel(lines) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let y = H / 2 - (lines.length * 46) / 2;
  for (const l of lines) {
    ctx.font = l.font;
    ctx.fillStyle = l.color;
    if (l.glow) { ctx.shadowColor = l.glow; ctx.shadowBlur = 20; }
    ctx.fillText(l.text, W / 2, y + (l.dy || 0));
    ctx.shadowBlur = 0;
    y += l.gap || 46;
  }
  ctx.textBaseline = 'top';
}

function drawMenu(t) {
  const bounce = Math.sin(t / 350) * 8;
  drawCenteredPanel([
    { text: '🍬', font: '80px "Segoe UI"', color: '#fff', dy: -70 + bounce, gap: 40 },
    { text: 'CANDY DROP', font: '900 58px "Segoe UI", sans-serif', color: '#FF3E7F', glow: '#FF7AA8', gap: 56 },
    { text: 'Catch the candy. Dodge the bombs. 💣', font: '600 20px "Segoe UI"', color: '#e8ddff', gap: 34 },
    { text: 'Build combos for BIG multipliers 🔥', font: '600 20px "Segoe UI"', color: '#e8ddff', gap: 60 },
    { text: Math.sin(t / 300) > -0.4 ? '▶  TAP / CLICK TO PLAY' : '', font: '800 26px "Segoe UI"', color: '#3EE577', glow: '#8CFFB5', gap: 50 },
    { text: 'move: mouse · touch · ← → keys', font: '500 14px "Segoe UI"', color: '#9d8ac9' },
  ]);
  if (best > 0) {
    ctx.font = '700 18px "Segoe UI"';
    ctx.fillStyle = '#FFD23F';
    ctx.textAlign = 'center';
    ctx.fillText('🏆 BEST: ' + best, W / 2, H - 60);
  }
}

function drawOver(t) {
  ctx.fillStyle = 'rgba(10,5,26,0.72)';
  ctx.fillRect(0, 0, W, H);
  const isRecord = score >= best && score > 0;
  drawCenteredPanel([
    { text: 'GAME OVER', font: '900 52px "Segoe UI"', color: '#FF5C5C', glow: '#FF9090', gap: 64 },
    { text: score + ' points', font: '800 40px "Segoe UI"', color: '#FFD23F', glow: '#FFE888', gap: 44 },
    { text: isRecord ? '🎉 NEW BEST SCORE! 🎉' : '🏆 best: ' + best, font: '700 22px "Segoe UI"', color: isRecord ? '#3EE577' : '#b6a3e8', gap: 36 },
    { text: 'level ' + level + '  ·  max combo ' + bestCombo + '🔥', font: '600 18px "Segoe UI"', color: '#e8ddff', gap: 62 },
    { text: overCooldown <= 0 && Math.sin(t / 300) > -0.4 ? '▶  TAP TO PLAY AGAIN' : '', font: '800 26px "Segoe UI"', color: '#3EE577', glow: '#8CFFB5' },
  ]);
}

function drawCursorDot() {
  // small marker since cursor is hidden
  if (state === STATE.PLAYING) return;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(player.targetX, H - 52, 4, 0, Math.PI * 2);
  ctx.fill();
}

// ---------- main loop ----------
function frame(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000 || 0.016);
  lastTime = t;

  update(dt);

  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawBackground();
  for (const it of items) drawItem(it);
  drawParticles();
  if (state !== STATE.MENU) drawPlayer();
  drawPopups();

  if (state === STATE.PLAYING) drawHUD();
  else if (state === STATE.MENU) drawMenu(t);
  else drawOver(t);

  // level-up banner
  if (levelBanner > 0 && state === STATE.PLAYING) {
    const a = Math.min(1, levelBanner);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '900 56px "Segoe UI"';
    ctx.fillStyle = '#3EE577';
    ctx.shadowColor = '#8CFFB5'; ctx.shadowBlur = 26;
    ctx.fillText('LEVEL ' + level + '!', W / 2, H / 2 - 40);
    ctx.font = '700 20px "Segoe UI"';
    ctx.fillStyle = '#e8ddff';
    ctx.shadowBlur = 0;
    ctx.fillText('faster & sweeter 🍭', W / 2, H / 2 + 26);
    ctx.globalAlpha = 1;
  }

  drawCursorDot();
  ctx.restore();

  // screen flash
  if (flash > 0) {
    ctx.globalAlpha = flash * 0.35;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
